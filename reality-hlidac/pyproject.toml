[project]
name = "reality-hlidac"
version = "0.1.0"
description = "Watches new flat listings on Sreality.cz and sends SMS alerts."
requires-python = ">=3.12"
# The watcher uses only the standard library; these are for the web app.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "tzdata>=2025.2",  # time zones even on minimal systems (Docker slim images)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx==0.28.1"]

[tool.setuptools]
packages = ["hlidac", "hlidac.sreality", "hlidac.notify", "hlidac.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"hlidac.web" = ["templates/*.html", "static/*"]
