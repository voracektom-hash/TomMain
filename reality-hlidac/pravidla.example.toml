# Pravidla pro Reality Hlídač.
# Zkopíruj:  cp pravidla.example.toml pravidla.toml   a uprav podle sebe.
# Nahraj:    make import-rules      (pravidla se stejným názvem se přepíšou)
# Ověř:      make preview           (kolik bytů by pravidlo chytilo)
#
# Stačí "nazev" a "lokalita", všechno ostatní je volitelné.
# Notifikace přijde, když inzerát splní ASPOŇ JEDNO pravidlo.

[[pravidlo]]
nazev = "Smíchov 2-3 pokoje do 9M"
lokalita = "Smíchov"              # obvod (Praha 5), městská část (Praha-Libuš), část (Smíchov) nebo obec (Černošice)
dispozice = ["2+kk", "2+1", "3+kk"]   # možnosti: 1+kk 1+1 2+kk 2+1 3+kk 3+1 4+kk 4+1 5+kk 5+1 "6 a více" Atypický
plocha_od = 50                    # m²
plocha_do = 90
max_cena = 9_000_000              # Kč
max_cena_m2 = 160_000             # Kč/m²
vlastnictvi = ["osobní"]          # osobní, družstevní, státní/obecní
bez_prizemi = true                # vynechat 1. NP (přízemí)
# min_podlazi = 3                 # 1 = přízemí, 2 = 1. patro…
# min_pod_medianem = 5            # aspoň o 5 % levnější než medián Kč/m² v lokalitě
vyloucena_slova = ["podíl", "dražba", "nájemník", "rezervováno"]   # stačí základní tvar slova
tichy_rezim = "22-7"              # mezi 22 a 7 hodinou nic nepípne; "ne" = bez tichého režimu
tichy_rezim_akce = "rano"         # "rano" = pošle se v 7:00, "zahodit" = nepošle se vůbec
alert_sleva = true                # upozornit i na snížení ceny

[[pravidlo]]
nazev = "Černošice cokoliv pod mediánem"
lokalita = "Černošice"
min_pod_medianem = 10
alert_sleva = true
